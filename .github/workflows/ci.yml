name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 仓库自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # 数据完整性、元信息一致性、站内链接（HTML 与 Markdown）
      # 全部由仓库内的零依赖脚本完成，不下载任何外部工具
      - name: 运行自检
        run: node scripts/check.mjs
