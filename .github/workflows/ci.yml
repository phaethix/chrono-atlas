name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 数据与链接自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行自检
        run: node scripts/check.mjs

  format:
    name: 格式检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 演示脚本刻意保留对齐的表格状写法，已在 .prettierignore 中排除
      - name: 检查格式
        run: npx --yes prettier@3.9.10 --check "**/*.{json,css,md,yml,yaml}"

  links:
    name: 站外链接可达性
    runs-on: ubuntu-latest
    # 外网偶发不可达不应阻塞合并，只作提示
    continue-on-error: true
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 检查 README 与文档中的外链
        run: |
          npx --yes markdown-link-check@3.12.2 README.md --quiet || true
          npx --yes markdown-link-check@3.12.2 README.zh-CN.md --quiet || true
