name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 仓库自检
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 数据完整性、元信息一致性、站内链接（HTML 与 Markdown）
      # 全部由仓库内的零依赖脚本完成，不下载任何外部工具
      - name: 运行自检
        run: node scripts/check.mjs

  format:
    name: 格式
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 唯一依赖外部工具的一步。版本与 package.json 里锁定的相同，
      # 本地 npx prettier --check . 通过，这里就不会失败。
      # demos/ 下的三个文件在 .prettierignore 里，这是刻意的例外。
      - name: 检查格式
        run: npx --yes prettier@3.9.10 --check .

  commits:
    name: 提交信息
    runs-on: ubuntu-latest
    # 只在 PR 上检查新增的提交；push 到 main 时这些提交已经过评审
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          # 需要完整历史才能取出 PR 的提交区间
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 与 .githooks/commit-msg 共用同一份逻辑，规范只写一处
      - name: 检查提交信息
        run: node scripts/check-commits.mjs "origin/${{ github.base_ref }}..HEAD"
