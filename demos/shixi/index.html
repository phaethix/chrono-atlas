<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>五帝世系 · 血缘与继位 | 时空图集</title>
    <meta
      name="description"
      content="五帝谱系图：二十二个人，三十五条边。血缘按代排列，继位另画一条线，两条线对不上的地方一目了然。"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <span class="eyebrow">祖先 · 第一卷 · 人物关系</span>
        <h1>五帝世系 <em>血缘与继位</em></h1>
      </div>
      <div class="legend">
        <b><i class="ln kin"></i>亲子</b>
        <b><i class="ln succ"></i>继位</b>
        <b><i class="ln war"></i>敌对</b>
      </div>
    </header>

    <div class="stage">
      <div class="mapwrap">
        <svg
          id="map"
          viewBox="0 0 1000 720"
          preserveAspectRatio="xMidYMid meet"
          aria-label="五帝世系图"
        >
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path d="M0,1 L9,5 L0,9 z" fill="#d4a017" />
            </marker>
          </defs>
          <g id="rows"></g>
          <g id="edges"></g>
          <g id="succ"></g>
          <g id="wars"></g>
          <g id="nodes"></g>
        </svg>
      </div>

      <aside>
        <div class="panel">
          <div class="eyebrow">人物</div>
          <h2 id="personName"></h2>
          <div class="alias" id="personAlias"></div>
          <p class="role" id="personRole"></p>
          <p class="note" id="personNote"></p>
          <dl class="facts" id="personFacts"></dl>
        </div>

        <div class="panel">
          <div class="eyebrow">演化进程</div>
          <ol class="steps" id="stepList"></ol>
          <p class="caption" id="stepText"></p>
        </div>
      </aside>
    </div>

    <div class="controls">
      <button class="primary" id="btnPlay">播放</button>
      <button id="btnPrev">上一步</button>
      <button id="btnNext">下一步</button>
      <button id="btnReset">重置</button>
      <div class="spacer"></div>
      <span class="hint">悬停看一支，点击看一人</span>
    </div>

    <script src="../../corpus/core.js"></script>
    <script src="../../corpus/schema.js"></script>
    <script src="../../corpus/people/shanggu.js"></script>
    <script src="../../corpus/relations/shanggu.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
