<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>祖先 · 从蛙到龙（前 7000 — 前 1900）| 时空图集</title>
    <meta
      name="description"
      content="史前五千年的文化区变迁动画：满天星斗的新石器文化、炎帝东征与涿鹿之战、尧舜的联盟与二里头的宫城。传说与考古分层标注。"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="mapwrap" id="mapwrap">
        <svg
          id="map"
          viewBox="0 0 1000 720"
          preserveAspectRatio="xMidYMid meet"
          aria-label="中国史前文化区图"
        >
          <defs id="defs">
            <radialGradient id="landGrad" cx="42%" cy="38%" r="72%">
              <stop offset="0%" stop-color="#1a2431" />
              <stop offset="100%" stop-color="#0e1520" />
            </radialGradient>
            <pattern id="gridPat" width="50" height="50" patternUnits="userSpaceOnUse">
              <path
                d="M50 0 L0 0 0 50"
                fill="none"
                stroke="rgba(255,255,255,.028)"
                stroke-width="1"
              />
            </pattern>
            <filter id="landGrow" x="-18%" y="-18%" width="136%" height="136%">
              <feMorphology operator="dilate" radius="9" in="SourceGraphic" />
            </filter>
          </defs>
          <rect x="0" y="0" width="1000" height="720" fill="url(#landGrad)" />
          <rect x="0" y="0" width="1000" height="720" fill="url(#gridPat)" />
          <g id="landmass"></g>
          <g id="regions"></g>
          <g id="rivers"></g>
          <g id="conquest"></g>
          <g id="battles"></g>
          <g id="ripples"></g>
          <g id="labels"></g>
        </svg>
        <div class="mapmeta">
          <strong id="metaTitle">满天星斗</strong>
          <span id="metaSub">文化区与聚落</span>
        </div>
        <div class="legend" id="legend"></div>
        <div class="annex" id="annex"></div>
        <div class="dossier" id="dossier"></div>
        <div class="tip" id="tip"></div>
      </div>

      <aside>
        <div class="panel">
          <div class="yearpanel">
            <div class="yearbig" id="yearBig">前 7000 年</div>
            <div class="era" id="eraTag">夏娃</div>
          </div>
          <div class="yearnote" id="yearNote">点：几个聚落，几处火塘。</div>
        </div>

        <div class="panel">
          <h3 id="powerTitle">文化分布</h3>
          <div class="power" id="powerList"></div>
        </div>

        <div class="panel">
          <h3>纪事</h3>
          <div class="events" id="eventList">
            <div class="empty">尚未发生任何大事。</div>
          </div>
        </div>
      </aside>
    </div>

    <div class="controls">
      <div class="crow">
        <button class="primary" id="btnPlay">播放</button>
        <button id="btnPrevEvt">上一事件</button>
        <button id="btnNextEvt">下一事件</button>
        <button id="btnReset">回到前 7000 年</button>
        <div class="spacer"></div>
        <span style="font-size: 11px; color: var(--dim); letter-spacing: 0.1em">速度</span>
        <div class="speed" id="speedBox">
          <button data-speed="0.5">0.5×</button>
          <button data-speed="1" class="on">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="4">4×</button>
        </div>
      </div>
      <div class="crow">
        <div class="trackwrap">
          <div class="evtmarks" id="evtmarks"></div>
          <input type="range" id="slider" min="-7000" max="-1900" step="1" value="-7000" />
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
